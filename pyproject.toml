[project]
name = "clinical-evidence-qa"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "defusedxml>=0.7.1",
    "ipykernel>=7.4.0",
    "lxml>=6.1.3",
    "nbformat>=5.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
